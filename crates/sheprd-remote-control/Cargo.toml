[package]
description            = "Serves Herdr chats to paired phones over HTTPS, with push notifications"
edition.workspace      = true
license.workspace      = true
name                   = "sheprd-remote-control"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[features]
# The daemon itself. Sheprd depends on this crate without it, for the
# control protocol and `app` alone, so Tokio never reaches the GUI.
default = ["server"]
server = [
    "dep:aes-gcm",
    "dep:axum",
    "dep:futures-lite",
    "dep:getrandom",
    "dep:gix",
    "dep:hkdf",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:if-addrs",
    "dep:maud",
    "dep:mdns-sd",
    "dep:sheprd-backend",
    "dep:sheprd-session",
    "dep:pulldown-cmark",
    "dep:quinn",
    "dep:rcgen",
    "dep:rustls",
    "dep:sheprd-apns",
    "sheprd-relay/client",
    "dep:sheprd-terminal",
    "dep:sheprd-tunnel",
    "dep:socket2",
    "dep:sysinfo",
    "dep:time",
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:tracing-subscriber",
    "dep:ureq",
    "dep:x509-parser",
]

[[bin]]
name              = "sheprd-remote-control"
path              = "src/main.rs"
required-features = ["server"]

[dependencies]
# A borrowed GitHub token on the control socket, redacted in `Debug`.
secrecy.workspace              = true
sheprd-apns                    = { optional = true, workspace = true }
sheprd-chat-protocol.workspace = true
sheprd-client.workspace        = true
sheprd-github.workspace        = true
# Relay addresses in `[remote] relays`; with `server`, listening on them
# (`client`), so paired phones reach this computer from anywhere.
sheprd-relay.workspace         = true
# Checking the far computer's signed answer to a phone's relay keys
# (`control::host_relay`), which Sheprd does too; already in its graph
# through `sheprd-relay`.
base64.workspace               = true
p256.workspace                 = true
sha2.workspace                 = true
# The pairing dialog's QR code, drawn by Sheprd.
qrcode.workspace              = true
# The macOS user ID the LaunchAgent loads under, and the server's host name.
rustix                        = { features = ["system"], workspace = true }
serde.workspace               = true
serde_json.workspace          = true
# `enroll` replaces a host's Sheprd settings whole, as Sheprd does.
tempfile.workspace            = true
thiserror.workspace           = true
# A host's own `[remote]` table, read by `enroll`.
toml.workspace                = true
# Settings edits to the `[remote]` table.
toml_edit.workspace           = true
tracing.workspace             = true
url.workspace                 = true
uuid.workspace                = true

aes-gcm        = { optional = true, workspace = true }
axum           = { optional = true, workspace = true }
futures-lite   = { optional = true, workspace = true }
getrandom      = { optional = true, workspace = true }
gix            = { optional = true, workspace = true }
hkdf           = { optional = true, workspace = true }
# Serving the API over a relay's end-to-end tunnel, as axum serves it over TLS.
# Claims a desktop makes of a nearby Sheprd, inside the relay's tunnel.
http-body-util = { optional = true, workspace = true }
hyper          = { features = ["client", "http1", "server"], optional = true, workspace = true }
hyper-util     = { features = ["service", "tokio"], optional = true, workspace = true }
if-addrs       = { optional = true, workspace = true }
maud           = { optional = true, workspace = true }
# Advertises the daemon over Bonjour so phones nearby find it to pair.
mdns-sd        = { optional = true, workspace = true }
pulldown-cmark = { optional = true, workspace = true }
# The relay connection a desktop's claim and `relay-connect` dial over.
quinn          = { optional = true, workspace = true }
rcgen          = { optional = true, workspace = true }
rustls         = { optional = true, workspace = true }
sheprd-backend = { optional = true, workspace = true }
sheprd-core-client.workspace = true
sheprd-session = { optional = true, workspace = true }
sheprd-terminal = { optional = true, workspace = true }
sheprd-tunnel  = { features = ["tokio"], optional = true, workspace = true }
socket2        = { optional = true, workspace = true }
# This computer's CPU and memory, shown above its workspaces on a phone.
sysinfo        = { optional = true, workspace = true }
time           = { optional = true, workspace = true }
# `relay-connect` carries SSH between its stdio and the tunnel.
tokio          = { features = ["io-std", "io-util"], optional = true, workspace = true }
tokio-rustls   = { optional = true, workspace = true }
# The daemon log: requests, refused handshakes, and errors phones report.
tracing-subscriber = { features = ["fmt"], optional = true, workspace = true }
ureq           = { optional = true, workspace = true }
x509-parser    = { optional = true, workspace = true }

# The host name for the CA's name and `HOSTNAME.local`.
[target.'cfg(unix)'.dependencies]

[dev-dependencies]
futures-util.workspace      = true
# A real relay on loopback, for the daemon's relay tests.
sheprd-relay                = { features = ["client", "server"], workspace = true }
roxmltree.workspace         = true
tokio-tungstenite.workspace = true
tower.workspace             = true
